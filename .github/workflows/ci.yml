name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,fdd]"
      - name: Tests (golden outputs; VBA golden replay and data-dependent tests skip)
        run: pytest -q
      - name: Results reproduce byte-for-byte on Linux
        run: |
          python scripts/run_calcs.py
          python scripts/psychro_crosscheck.py
          python scripts/maint_calcs.py
          git diff --exit-code -- results/
